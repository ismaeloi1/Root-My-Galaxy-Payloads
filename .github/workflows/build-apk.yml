name: Build Root My Galaxy APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'support/targets-v3.json'
      - 'artifacts/**'
      - 'kernelsu/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout payloads repo
        uses: actions/checkout@v4

      - name: Clone Root-My-Galaxy app
        run: git clone --depth 1 https://github.com/BuSung-dev/Root-My-Galaxy.git app-build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Patch PayloadRepository to use this fork
        run: |
          FILE="app-build/app/src/main/java/dev/busung/s25uroot/PayloadRepository.kt"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="Root-My-Galaxy-Payloads"

          python3 << PYEOF
          import re

          with open("$FILE") as f:
              code = f.read()

          # Replace COMMIT_API_URL and RAW_REPOSITORY to point to this fork
          code = code.replace(
              'BuSung-dev/Root-My-Galaxy-Payloads',
              '${REPO_OWNER}/${REPO_NAME}'
          )

          # Make pinArtifactUrl accept URLs from both repos (upstream BuSung-dev and this fork)
          old_pin = '''    private fun pinArtifactUrl(url: String, commit: String): String {
                  require(url.startsWith(MUTABLE_RAW_PREFIX)) { context.getString(R.string.repo_url_invalid) }
                  return "\$RAW_REPOSITORY/\$commit/\${url.removePrefix(MUTABLE_RAW_PREFIX)}"
              }'''

          new_pin = '''    private fun pinArtifactUrl(url: String, commit: String): String {
                  val prefixes = listOf(
                      MUTABLE_RAW_PREFIX,
                      "https://raw.githubusercontent.com/BuSung-dev/Root-My-Galaxy-Payloads/main/",
                  )
                  for (prefix in prefixes) {
                      if (url.startsWith(prefix)) {
                          return "\$RAW_REPOSITORY/\$commit/\${url.removePrefix(prefix)}"
                      }
                  }
                  throw IllegalArgumentException(context.getString(R.string.repo_url_invalid))
              }'''

          # Use a simpler regex approach
          code = re.sub(
              r'private fun pinArtifactUrl\(url: String, commit: String\): String \{\s*'
              r'require\(url\.startsWith\(MUTABLE_RAW_PREFIX\)\).*?\n'
              r'\s*return .*?removePrefix\(MUTABLE_RAW_PREFIX\)\)"\s*\}',
              '''private fun pinArtifactUrl(url: String, commit: String): String {
                  val prefixes = listOf(
                      MUTABLE_RAW_PREFIX,
                      "https://raw.githubusercontent.com/BuSung-dev/Root-My-Galaxy-Payloads/main/",
                  )
                  for (prefix in prefixes) {
                      if (url.startsWith(prefix)) {
                          return "\$RAW_REPOSITORY/\$commit/\$\{url.removePrefix(prefix)\}"
                      }
                  }
                  throw IllegalArgumentException(context.getString(R.string.repo_url_invalid))
              }''',
              code,
              flags=re.DOTALL,
          )

          with open("$FILE", "w") as f:
              f.write(code)

          print("Patched successfully")
          PYEOF

          echo "Verify patch:"
          grep -A 5 "pinArtifactUrl" "$FILE" | head -20

      - name: Build release APK
        working-directory: app-build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lintVitalRelease --no-daemon

      - name: Sign APK
        working-directory: app-build
        run: |
          keytool -genkeypair -v -keystore release.jks \
            -alias rootmygalaxy -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Root My Galaxy, OU=Dev, O=${{ github.repository_owner }}, L=Unknown, ST=Unknown, C=US"

          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="app-release-aligned.apk"
          SIGNED="RootMyGalaxy.apk"

          BUILD_TOOLS_DIR="${ANDROID_HOME}/build-tools/$(ls ${ANDROID_HOME}/build-tools/ | tail -1)"
          "${BUILD_TOOLS_DIR}/zipalign" -v -p 4 "$UNSIGNED" "$ALIGNED"
          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks release.jks --ks-key-alias rootmygalaxy \
            --ks-pass pass:android --key-pass pass:android \
            --out "$SIGNED" "$ALIGNED"
          "${BUILD_TOOLS_DIR}/apksigner" verify "$SIGNED"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RootMyGalaxy-APK
          path: app-build/RootMyGalaxy.apk
          retention-days: 90
